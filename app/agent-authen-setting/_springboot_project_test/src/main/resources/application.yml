server:
  port: 8080

# ============================================================
# Agent Proxy Configuration
# ============================================================
# Access patterns:
#   http://localhost:8080/proxy/agent/{name}/dev-ui/
#   http://localhost:8080/proxy/workflow/{name}/dev-ui/
# ============================================================
agent-proxy:
  agents:
    agent1: http://127.0.0.1:8003
    agent2: http://127.0.0.1:8004
  workflows:
    workflow1: http://127.0.0.1:9001

logging:
  level:
    com.example.agentproxy: DEBUG
