server:
  port: 8080

# ============================================================
# Agent Proxy Configuration
# ============================================================
# Access patterns:
#   http://localhost:8080/agent-proxy/agent/{id}/dev-ui/
#   http://localhost:8080/agent-proxy/agent/{id}/docs
#   http://localhost:8080/agent-proxy/workflow/{id}/dev-ui/
# ============================================================
agent-proxy:
  agents:
    1: http://127.0.0.1:8003
    2: http://127.0.0.1:8004
  workflows:
    1: http://127.0.0.1:80

logging:
  level:
    com.example.agentproxy: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId:-}] %-5level %logger{36} - %msg%n"

# ============================================================
# Spring Security – default user for testing
# ============================================================
spring:
  security:
    user:
      name: admin
      password: admin123

